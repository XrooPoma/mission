<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POMA - 사건 추리</title>
<style>
  :root {
    --navy: #0d1b2a;
    --navy-deep: #06101c;
    --red: #c0392b;
    --red-bright: #e74c3c;
    --gold: #d4a843;
    --paper: #f4ecd8;
    --ink: #1a1a1a;
    --success: #2e6b4f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #16263b 0%, var(--navy-deep) 55%, #03070c 100%);
    font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(212,168,67,0.035) 0 2px, transparent 2px 40px);
    pointer-events: none;
    z-index: 0;
  }

  .case-file {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #11233a 0%, #0d1b2a 100%);
    border: 1px solid rgba(212,168,67,0.35);
    border-radius: 18px;
    padding: 28px 24px 32px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02) inset;
    position: relative;
    z-index: 1;
  }

  .case-file::before {
    content: "CASE FILE";
    position: absolute;
    top: -11px;
    left: 24px;
    background: var(--red);
    color: var(--paper);
    font-size: 11px;
    letter-spacing: 0.18em;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }

  .eyebrow {
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--gold);
    margin: 6px 0 4px;
    font-weight: 600;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 18px;
    letter-spacing: 0.02em;
    color: var(--paper);
    font-weight: 800;
  }

  .portrait-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
    position: relative;
  }

  .portrait-frame {
    width: 188px;
    height: 188px;
    border-radius: 16px;
    background: var(--paper);
    border: 4px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 0 6px rgba(212,168,67,0.12), 0 14px 30px -8px rgba(0,0,0,0.6);
    position: relative;
  }

  .portrait-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* 상태 문구 영역 (정답/오답/기본 안내가 여기 들어감) */
  .message-box {
    text-align: center;
    font-size: 14px;
    color: rgba(244,236,216,0.78);
    margin-bottom: 22px;
    line-height: 1.7;
    min-height: 42px;
    padding: 0 4px;
  }

  .message-box strong { color: var(--gold); font-weight: 700; }

  .message-box.state-correct {
    color: var(--success);
    font-weight: 700;
    font-size: 15px;
  }

  .message-box.state-wrong {
    color: var(--red-bright);
    font-weight: 700;
    font-size: 15px;
  }

  .next-link-wrap {
    text-align: center;
    margin-top: 6px;
    margin-bottom: 24px;
  }

  .next-link-wrap a {
    display: inline-block;
    background: var(--success);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 8px;
    box-shadow: 0 8px 16px -6px rgba(46,107,79,0.6);
    transition: transform 0.12s ease;
  }

  .next-link-wrap a:hover { transform: translateY(-1px); }

  form { display: flex; flex-direction: column; gap: 12px; }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1.5px solid rgba(212,168,67,0.4);
    background: rgba(244,236,216,0.06);
    color: var(--paper);
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input[type="text"]::placeholder { color: rgba(244,236,216,0.4); }

  input[type="text"]:focus {
    border-color: var(--gold);
    background: rgba(244,236,216,0.1);
  }

  input[type="text"]:disabled {
    opacity: 0.5;
  }

  button[type="submit"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    color: var(--paper);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 8px 18px -6px rgba(192,57,43,0.55);
    position: relative;
    z-index: 2;
  }

  button[type="submit"]:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px -6px rgba(192,57,43,0.7);
  }

  button[type="submit"]:active { transform: translateY(0); }

  button[type="submit"]:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .footnote {
    text-align: center;
    margin-top: 16px;
    font-size: 11px;
    color: rgba(244,236,216,0.35);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

  <div class="case-file">
    <p class="eyebrow">DETECTIVE QUIZ</p>
    <h1>사건의 진범은 누구인가</h1>

    <div class="portrait-wrap">
      <div class="portrait-frame">
        <img id="mainImage" src="" alt="마루">
      </div>
    </div>

    <div class="message-box" id="messageBox">
      코난이 묻습니다.<br>사라진 작품명은 무엇인가요?<br>정답을 입력하고 사건을 해결하세요.
    </div>

    <div class="next-link-wrap" id="nextLinkWrap" style="display:none;">
      <a id="nextLinkAnchor" href="#" target="_blank" rel="noopener">다음 장소로 이동</a>
    </div>

    <form id="quizForm" novalidate>
      <input type="text" id="answerInput" name="answer" placeholder="정답을 입력하세요" autocomplete="off">
      <button type="submit" id="submitBtn">제출하기</button>
    </form>

    <p class="footnote">진실은 언제나 하나!</p>
  </div>

<script>
(function () {
  "use strict";

  /* CONFIG 영역만 바꾸면 이미지 / 문구 / 링크가 전부 바뀜, 주의할 것*/
  var CONFIG = {
    // 정답 문자열 (공백/대소문자는 자동으로 무시될 거임)
    correctAnswer: "돈키호테",

    // 기본(질문) 상태에서 보여줄 이미지 후보들
    // -> 페이지가 열릴 때마다 이 목록 중 하나를 랜덤으로 보여주되,
    //    "바로 직전에 보여줬던 이미지"와는 다른 쪽을 선택합니다.
    //    후보를 늘리고 싶으면 배열에 그냥 추가하면 됩니다.
    questionImages: ["마루질문1.png", "마루질문2.jpg"],

    // 정답일 때 보여줄 이미지 (단일)
    correctImages: ["마루정답.png"],

    // 오답일 때 보여줄 이미지 후보들 (직전 기록과 다른 쪽을 랜덤 선택)
    wrongImages: ["마루오답1.png", "마루오답2.png"],

    // 기본 안내 문구 (이미지 아래)
    defaultMessageHTML: "마루가 묻습니다.<br>사라진 작품명은 무엇인가요?<br>띄어쓰기없이 입력하고 사건을 해결하세요.",

    // 오답일 때 보여줄 문구
    wrongMessage: "범인을 아쉽게 놓쳤어!",

    // 정답일 때 보여줄 문구
    correctMessage: "범인을 거의 다 잡았어!! <br>범인의 결정적 증거를 찾았어!",

    // 정답일 때 보여줄 링크 (텍스트와 주소)
    nextLinkText: "다음 장소로 이동",
    nextLinkUrl: "https://www.instagram.com/poma.pohang?igsh=MTlvcjI4OWhtdnJqbw%3D%3D&utm_source=qr"
  };
  /* CONFIG 영역만 바꾸면 이미지 / 문구 / 링크가 전부 바뀜, 주의할 것*/

  // ===================================================================
  // "직전에 보여준 것과 다른 것"을 고르기 위한 랜덤 선택 로직
  // localStorage에 마지막으로 보여준 이미지를 기록해두고, 다음번엔 그것과
  // 다른 후보를 고릅니다. (브라우저를 닫고 다시 열어도 기록이 유지됩니다)
  // ===================================================================
  var STORAGE_PREFIX = "pomaQuiz3_lastImage_";

  function pickDifferentFromLast(candidates, storageKey) {
    // 후보가 1개뿐이면 그냥 그걸 반환
    if (!candidates || candidates.length === 0) return "";
    if (candidates.length === 1) return candidates[0];

    var lastValue = null;
    try {
      lastValue = window.localStorage.getItem(STORAGE_PREFIX + storageKey);
    } catch (e) {
      // localStorage를 못 쓰는 환경(시크릿 모드 등)이면 그냥 완전 랜덤으로
      lastValue = null;
    }

    var pool = candidates;
    if (lastValue) {
      var filtered = candidates.filter(function (c) { return c !== lastValue; });
      if (filtered.length > 0) pool = filtered;
    }

    var chosen = pool[Math.floor(Math.random() * pool.length)];

    try {
      window.localStorage.setItem(STORAGE_PREFIX + storageKey, chosen);
    } catch (e) {
      // 저장 실패해도 무시 (다음에도 완전 랜덤으로 동작)
    }

    return chosen;
  }

  function normalize(str) {
    return String(str || "").trim().toLowerCase().replace(/\s+/g, "");
  }

  function init() {
    var form = document.getElementById("quizForm");
    var input = document.getElementById("answerInput");
    var submitBtn = document.getElementById("submitBtn");
    var mainImage = document.getElementById("mainImage");
    var messageBox = document.getElementById("messageBox");
    var nextLinkWrap = document.getElementById("nextLinkWrap");
    var nextLinkAnchor = document.getElementById("nextLinkAnchor");

    // 초기 상태 세팅 (질문 이미지는 직전과 다른 것으로 랜덤 선택)
    mainImage.src = pickDifferentFromLast(CONFIG.questionImages, "question");
    messageBox.innerHTML = CONFIG.defaultMessageHTML;
    nextLinkAnchor.textContent = CONFIG.nextLinkText;
    nextLinkAnchor.href = CONFIG.nextLinkUrl;

    function showWrong() {
      mainImage.src = pickDifferentFromLast(CONFIG.wrongImages, "wrong");
      messageBox.classList.remove("state-correct");
      messageBox.classList.add("state-wrong");
      messageBox.textContent = CONFIG.wrongMessage;
      nextLinkWrap.style.display = "none";

      // 다시 추리할 수 있도록 입력창 보이기 + 초기화 후 포커스
      form.style.display = "flex";
      input.value = "";
      input.disabled = false;
      submitBtn.disabled = false;
      input.focus();
    }

    function showCorrect() {
      mainImage.src = pickDifferentFromLast(CONFIG.correctImages, "correct");
      messageBox.classList.remove("state-wrong");
      messageBox.classList.add("state-correct");
      messageBox.innerHTML = CONFIG.correctMessage;
      nextLinkWrap.style.display = "block";

      // 정답을 맞춘 뒤에는 입력란 자체를 화면에서 숨김
      form.style.display = "none";
    }

    function handleSubmit(evt) {
      if (evt && evt.preventDefault) evt.preventDefault();
      if (form.style.display === "none") return false;

      var isCorrect = normalize(input.value) === normalize(CONFIG.correctAnswer);
      if (isCorrect) {
        showCorrect();
      } else {
        showWrong();
      }
      return false;
    }

    form.addEventListener("submit", handleSubmit);
    submitBtn.addEventListener("click", function (evt) {
      evt.preventDefault();
      handleSubmit(evt);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
